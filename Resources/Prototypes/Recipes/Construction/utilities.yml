  graph: GasBinary
  startNode: start
  targetNode: bendradiator
  category: construction-category-utilities
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  icon:
    sprite: Structures/Piping/Atmospherics/heatexchanger.rsi
    state: heBend

# ATMOS TRINARY
