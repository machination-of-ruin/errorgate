# Empty mags
- type: entity
  id: BaseMagazineMagnumLeverRifle
  name: "magazine (.45 rifle)"
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - Magazine357MagnumLeverRifle
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge357Magnum
    proto: Cartridge357Magnum
    capacity: 8
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 9
    zeroVisible: false
  - type: Appearance

- type: entity
  id: Magazine357MagnumLeverRifle
  name: "lever rifle magazine (.45)"
  parent: BaseMagazineMagnumLeverRifle
  components:
  - type: Tag
    tags:
      - Magazine357MagnumLeverRifle
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Ammunition/Magazine/lever_rifle_mags.rsi

- type: entity
  id: Magazine357MagnumLeverRifleEmpty
  parent: Magazine357MagnumLeverRifle
  suffix: Empty
  components:
  - type: BallisticAmmoProvider
    proto: null
