- type: entity
  id: BaseMagazineBoxMagnumExtended
  parent: BaseAmmoBox357Magnum
  abstract: true
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge357Magnum
    proto: Cartridge357Magnum
    capacity: 16

- type: entity
  id: AmmoBox357MagnumEnsnaring
  parent: BaseMagazineBoxMagnumExtended
  name: ammunition box (.357 Magnum ensnaring)
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge357MagnumEnsnaring
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: incendiary #i changed just color because it almost white
      color: "#cfff77"

