- type: entity
  id: AmmoBox357MagnumFlash
  parent: BaseMagazineBoxMagnumExtended
  name: ammunition box (.357 Magnum flash)
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge357MagnumFlash
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: incendiary
      color: "#fff94d"
