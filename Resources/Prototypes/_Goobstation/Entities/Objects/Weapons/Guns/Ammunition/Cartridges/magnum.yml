- type: entity
  id: Cartridge357MagnumEnsnaring
  name: cartridge (.357 Magnum ensnaring)
  parent: BaseCartridge357Magnum
  components:
  - type: CartridgeAmmo
    proto: Bullet357MagnumEnsnaring
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#cfff77"

