- type: entity
  id: Cartridge357MagnumFlash
  name: cartridge (.357 Magnum flash)
  parent: BaseCartridge357Magnum
  components:
  - type: CartridgeAmmo
    proto: Bullet357MagnumFlash
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#fff94d"
