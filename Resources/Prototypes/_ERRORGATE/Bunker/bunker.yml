# The hidden bunker: a hatch somewhere remote on the map (placed at run time, the map file is not edited) leads to a bunker on a
# map of its own, through a timed vestibule. Nothing here says anything: there are only sounds and lights.

# The key. Only a few exist per round, see the Kuznetsk loot table.
- type: entity
  parent: AccessCardBase
  id: BunkerKey
  suffix: ERRORGATE
  components:
  - type: Sprite
    layers:
    - state: default
    - state: department
      color: "#5C5C5C"
    - state: subdepartment
      color: "#5C5C5C"
    - state: cargotechnician
  - type: Access
    tags:
    - Bunker

- type: entity
  id: BunkerHatch
  name: hatch
  parent: BaseStructure
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Structures/Doors/Airlocks/Standard/hatch.rsi
    drawdepth: Mobs
    layers:
    - state: closed
      map: [ "enum.BunkerHatchVisualLayers.Base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BunkerHatchVisuals.Open:
        enum.BunkerHatchVisualLayers.Base:
          True: { state: open }
          False: { state: closed }
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - AirlockLayer
  - type: AccessReader
    access: [["Bunker"]]
  - type: BunkerHatch

# The hatch up, at the far end of the vestibule. Welded shut to look at while it is locked.
- type: entity
  id: BunkerLadder
  name: hatch
  parent: BaseStructure
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Structures/Doors/Airlocks/Standard/hatch.rsi
    drawdepth: Mobs
    layers:
    - state: welded
      map: [ "enum.BunkerExitVisualLayers.Base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BunkerExitVisuals.Locked:
        enum.BunkerExitVisualLayers.Base:
          True: { state: welded }
          False: { state: open }
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: BunkerLadder

# Concrete walls of the bunker rooms: the dark concrete look, but they cannot be broken
- type: entity
  parent: BaseWallIndestructible
  id: BunkerWallConcrete
  name: concrete wall
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Walls/nc14/concretedark.rsi
  - type: Icon
    sprite: _Nuclear14/Structures/Walls/nc14/concretedark.rsi
  - type: IconSmooth
    key: wallsstore
    base: store

# The door between the vestibule and the bunker
- type: entity
  id: BunkerVestibuleDoor
  parent: AirlockTough
  suffix: Bunker vestibule
  categories: [ HideSpawnMenu ]
  components:
  - type: BunkerVestibuleDoor

- type: entity
  id: BunkerVestibule
  name: vestibule controller
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: BunkerVestibule

# Turns while the vestibule cycles, with a siren
- type: entity
  id: BunkerWarningLight
  name: warning light
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Structures/Wallmounts/Lighting/emergency_light.rsi
    drawdepth: WallMountedItems
    layers:
    - state: base
    - state: emergency_light_on
      color: "#D41E1E"
      shader: unshaded
  - type: PointLight
    enabled: false
    radius: 6
    energy: 3
    color: "#D41E1E"
    offset: "0, 0.4"
    mask: /Textures/Effects/LightMasks/double_cone.png
  - type: RotatingLight
    speed: 150
  - type: AmbientSound
    enabled: false
    range: 12
    volume: 2
    sound:
      path: /Audio/Machines/alarm.ogg
