# ERRORGATE: world faults. Environmental hazards, not creatures: they sit where the field put them and punish whatever
# steps into them. They are nearly invisible: the screen effects (haze, static, drained colour) are the warning.
# Rule: damage radius <= screen effect radius ("warningRadius", also the range of the ambient sound) <= ~8 tiles, the
# throwing range, so a player who does not rush notices the fault, and can test it with a thrown item, before it hurts.
# A fault shows itself for a few seconds when something is thrown into it or when it hurts someone: the sprite layers
# below hold that revealed look, the client scales their opacity down to "restAlpha" while hidden.
# No Physics and no Damageable on purpose: nothing collides with them, nothing breaks them, explosions skip them.

- type: entity
  abstract: true
  id: ErrorgateAnomalyBase
  components:
  - type: Tag
    tags:
    - HideContextMenu
  - type: ErrorgateAnomaly
    revealDuration: 8
  - type: Sprite
    noRot: true
    drawdepth: Effects

# HEAT FAULT: a zone of burning air. The haze is drawn by the client around the fault. The red sphere is always there.
- type: entity
  id: ErrorgateAnomalyHeat
  parent: ErrorgateAnomalyBase
  components:
  - type: ErrorgateAnomaly
    kind: Heat
    radius: 5
    warningRadius: 8
    damageInterval: 0.5
    tickSound:
      path: /Audio/Effects/burning.ogg
      params:
        volume: 0
    revealSound:
      path: /Audio/Magic/fireball.ogg
      params:
        volume: 4
        maxDistance: 20
    restAlpha: 0
    restLightEnergy: 0
    restLightRadius: 2.5
    revealedLightEnergy: 1.6
    revealedLightRadius: 5
  - type: HeatFault
  - type: Sprite
    color: "#ffffff48"
    layers:
    - sprite: Structures/Specific/Anomalies/pyro_anom.rsi
      state: anom
      shader: unshaded
      color: "#ff5a2a70"
      scale: 3, 3
  - type: PointLight
    enabled: true
    radius: 2.5
    energy: 0.5
    softness: 1
    color: "#e0561f"
    castShadows: false
  - type: AmbientSound
    enabled: true
    range: 8
    volume: -2
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg

# ARC FAULT: a discharge without a circuit. Throws arcs at whatever is near, shocks what stands in it,
# and fills the screen of whoever comes close with static.
- type: entity
  id: ErrorgateAnomalyArc
  parent: ErrorgateAnomalyBase
  components:
  - type: ErrorgateAnomaly
    kind: Arc
    radius: 2
    dangerRadius: 4
    revealRadius: 4
    warningRadius: 6.5
    damageInterval: 1
    revealSound:
      path: /Audio/Effects/Lightning/lightningshock.ogg
      params:
        volume: -12
    restAlpha: 0.04
    restLightEnergy: 0.25
    restLightRadius: 1.2
    revealedLightEnergy: 2.2
    revealedLightRadius: 4
  - type: ArcFault
  - type: Sprite
    color: "#ffffff0a"
    layers:
    - sprite: Effects/electricity.rsi
      state: electrified
      shader: unshaded
      color: "#8fb4ffd0"
      scale: 2, 2
    - sprite: Structures/Specific/anomaly.rsi
      state: anom3
      shader: unshaded
      color: "#9bbcff50"
      scale: 2, 2
  - type: PointLight
    enabled: true
    radius: 1.2
    energy: 0.25
    softness: 1
    color: "#6f9bff"
    castShadows: false
  - type: AmbientSound
    enabled: true
    range: 8
    volume: -2
    sound:
      path: /Audio/Ambience/Objects/emf_buzz.ogg

# COLLAPSE FAULT: a gravity error. Off, it is invisible and harmless. On, it waits behind a faint lens until something walks
# or flies into reach: then everything loose falls toward it, the center crushes and the lens widens to the pull area (loot lying next to it can be taken then, at a risk). The world loses its colour near it.
- type: entity
  id: ErrorgateAnomalyCollapse
  parent: ErrorgateAnomalyBase
  components:
  - type: ErrorgateAnomaly
    kind: Collapse
    radius: 2
    dangerRadius: 3.5
    revealRadius: 4
    warningRadius: 9
    damageInterval: 0.5
    triggerToEngage: true
    activeSeconds: 12
    idleSeconds: 7
    activeVolume: -3
    idleVolume: -12
    damage:
      types:
        Blunt: 35
    tickSound:
      path: /Audio/Ambience/Objects/crushing.ogg
      params:
        volume: -4
    revealSound:
      path: /Audio/Ambience/Objects/crushing.ogg
      params:
        volume: -12
    restAlpha: 0
    restLightEnergy: 0
    restLightRadius: 2
    revealedLightEnergy: -2.5
    revealedLightRadius: 5
  - type: CollapseFault
  - type: Sprite
    color: "#ffffff0d"
    layers:
    - sprite: Structures/Specific/Anomalies/shadow_anom.rsi
      state: anom
      color: "#100818d0"
      scale: 1.6, 1.6
  - type: PointLight
    enabled: true
    radius: 2
    energy: -0.4
    softness: 1
    color: "#1a0a1f"
    castShadows: false
  - type: SingularityDistortion
    intensity: 3000
    falloffPower: 2.7
  - type: AmbientSound
    enabled: true
    range: 8
    volume: -3
    sound:
      path: /Audio/Effects/singularity.ogg

# The arc of an arc fault. A plain lightning bolt, but touching it does nothing: the shock is dealt by the fault,
# once, and with the immunity window.
- type: entity
  id: ErrorgateArcBolt
  parent: Lightning
  categories: [ HideSpawnMenu ]
  components:
  - type: Electrified
    enabled: false
