# The locations of the world, see docs/design/world.md. First slice: tier 1 and tier 2; tier 3 (the bunker-laboratory) comes with its generator.

- type: worldLocation
  id: Village
  name: village and shore resort
  tier: 1
  theme: village
  size: "160,160"
  ground: FloorPlanetGrass
  road: FloorPlanetDirt
  density: 1
  rocks: 12
  treeClumps: 14
  treeSingles: 50
  shore: water
  trees:
  - FloraTree
  - FloraTreeLarge
  - N14FloraTreePine
  - N14FloraTreeBald
  props:
  - protos: [ FloraRockSolid ]
    count: 30
    clump: 0
  - protos: [ Barricade, BarricadeBlock ]
    count: 10
    clump: 2
  decals:
  - decals: [ FloraTallGrass1, FloraTallGrass2, FloraTallGrass3, FloraTallGrass4, FloraTallGrass5, FloraTallGrass6, FloraTallGrass7, FloraTallGrass8 ]
    count: 220
    clump: 5
  - decals: [ FloraBranchBrushwood, FloraBranchBrushwoodAlt ]
    count: 70
    clump: 3
  ambientLight: "#7A7A7A"

- type: worldLocation
  id: SnowCity
  name: snow city
  tier: 2
  theme: city
  size: "180,180"
  ground: FloorSnow
  road: FloorAsphalt
  density: 1
  rocks: 10
  treeClumps: 8
  treeSingles: 30
  shore: ice
  weather: SnowfallLight
  trees:
  - FloraTreeSnow
  - FloraTreeConifer
  - FloraTreeStumpConifer
  props:
  - protos: [ FloraRockSolid ]
    count: 24
    clump: 0
  - protos: [ Barricade, BarricadeBlock ]
    count: 16
    clump: 2
  decals:
  - decals: [ FloraBranchBrushwood, FloraBranchBrushwoodAlt ]
    count: 40
    clump: 3
  ambientLight: "#6A6E78"

# The border of a location: rock that cannot be dug out.
- type: entity
  parent: BaseWallIndestructible
  id: WorldBorderWall
  name: rock
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    layers:
    - state: rock_wall
  - type: Icon
    sprite: Structures/Walls/rock.rsi
    state: rock_wall
  - type: IconSmooth
    mode: NoSprite
