# The locations of the world, see docs/design/world.md. First slice: tier 1 and tier 2; tier 3 (the bunker-laboratory) comes with its generator.

- type: worldLocation
  id: Village
  name: village and shore resort
  tier: 1
  resetMinMinutes: 360
  resetMaxMinutes: 720
  theme: village
  style: village
  walkway: FloorLowDesert
  fenceStraight: FenceWoodHighStraight
  fenceCorner: FenceWoodHighCorner
  fenceGate: FenceWoodHighGate
  size: "160,160"
  ground: FloorPlanetGrass
  road: FloorPlanetDirt
  density: 1
  rocks: 12
  treeClumps: 14
  treeSingles: 50
  shore: water
  trees:
  - FloraTree
  - FloraTreeLarge
  - N14FloraTreePine
  - N14FloraTreeBald
  props:
  - protos: [ FloraRockSolid ]
    count: 30
    clump: 0
  decals:
  - decals: [ FloraBranchBrushwood, FloraBranchBrushwoodAlt ]
    count: 70
    clump: 3
  ambientLight: "#7A7A7A"

- type: worldLocation
  id: SnowCity
  name: snow city
  tier: 2
  resetMinMinutes: 360
  resetMaxMinutes: 720
  theme: city
  style: city
  walkway: FloorGrayConcreteSmooth
  post: LightPostSmall
  fenceStraight: FenceMetalStraight
  fenceCorner: FenceMetalCorner
  fenceGate: FenceMetalGate
  size: "180,180"
  ground: FloorSnow
  road: FloorAsphalt
  density: 1
  rocks: 10
  treeClumps: 8
  treeSingles: 30
  shore: ice
  weather: SnowfallLight
  trees:
  - FloraTreeSnow
  - FloraTreeConifer
  - FloraTreeStumpConifer
  props:
  - protos: [ FloraRockSolid ]
    count: 24
    clump: 0
  - protos: [ Barricade, BarricadeBlock ]
    count: 16
    clump: 2
  decals:
  - decals: [ FloraBranchBrushwood, FloraBranchBrushwoodAlt ]
    count: 40
    clump: 3
  ambientLight: "#6A6E78"

# The border of a location: rock that cannot be dug out.
- type: entity
  parent: BaseWallIndestructible
  id: WorldBorderWall
  name: rock
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    layers:
    - state: rock_wall
  - type: Icon
    sprite: Structures/Walls/rock.rsi
    state: rock_wall
  - type: IconSmooth
    mode: NoSprite

# The two ends of a tunnel are gates; people use them to go to the other side. Looks like the hatch of the bunker until it has art of its own.
- type: entity
  id: WorldGate
  parent: BaseStructure
  name: hatch
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Structures/Doors/Airlocks/Standard/hatch.rsi
    drawdepth: Mobs
    layers:
    - state: closed
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - AirlockLayer
  - type: WorldTransition

# A tunnel between the village and the city. It is wiped with the city.
- type: worldLocation
  id: TunnelVillageCity
  name: tunnel
  tier: 1
  style: tunnel
  underground: true
  size: "140,48"
  ground: FloorCave
  post: LightPostSmall
  mobs: [ MobSpawnerRunner, MobSpawnerWalkerLiving ]
  mobCount: 4
  ambientLight: "#141414"
  resetWith: SnowCity

# The web: which locations exist and which gates lead to which.
- type: worldGraph
  id: Default
  locations:
  - Village
  - TunnelVillageCity
  - SnowCity
  links:
  - a: Village.east
    b: TunnelVillageCity.west
  - a: TunnelVillageCity.east
    b: SnowCity.west
