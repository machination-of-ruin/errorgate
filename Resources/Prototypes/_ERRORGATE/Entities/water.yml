- type: entity
  id: FloorWaterEntityToxic
  parent: FloorWaterEntity
  suffix: Toxic
  description: A real thirst quencher.
  components:
  - type: SolutionContainerManager
    solutions:
      pool:
        maxVol: 9999999 #.inf seems to break the whole yaml file, but would definitely be preferable.
        reagents:
        - ReagentId: Water
          Quantity: 9000000
        - ReagentId: ContaminatedWater
          Quantity: 999999
  - type: SolutionRegeneration
    solution: pool
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 90
      - ReagentId: ContaminatedWater
        Quantity: 10

# The sparkle that shows where loot appears. The old build drew it above everything (depth 10); the stock puddle sparkle sits
# under the items, where it cannot be seen.
- type: entity
  id: LootSpawnSparkle
  parent: PuddleSparkle
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Effects
