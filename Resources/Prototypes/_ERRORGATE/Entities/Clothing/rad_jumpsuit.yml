# The radiation suit as a jumpsuit: it takes the jumpsuit slot, so the outer slot stays free for armor and coats. Same protection, same hood,
# same geiger counter as the radiation suit it is a child of. Only the slot and the sprite (renamed for the slot) differ. It is what the loot
# gives out instead of the outer radiation suit.
- type: entity
  parent: ClothingOuterSuitRad
  id: ClothingUniformJumpsuitRad
  suffix: Jumpsuit
  components:
  - type: Sprite
    sprite: _ERRORGATE/Clothing/Uniforms/rad_jumpsuit.rsi
  - type: Clothing
    sprite: _ERRORGATE/Clothing/Uniforms/rad_jumpsuit.rsi
    slots: [ innerclothing ]
  - type: ToggleableClothing # the hood still comes up, from the jumpsuit slot
    requiredSlot: INNERCLOTHING
