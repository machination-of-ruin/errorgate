# A faint light around your own character, spawned on the client of the player only (PlayerGlowSystem), never on the server. It is not
# a light source: the system sets its energy each moment so that a dark place is brought up to the floor and nothing more, and a place
# that is already bright gets nothing from it. Small on purpose: nights stay dark.
- type: entity
  id: ErrorgatePlayerGlow
  name: player glow
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
  - type: PlayerGlow
    floor: 0.14
  - type: PointLight
    enabled: false
    radius: 2
    castShadows: false
    energy: 0
    softness: 1
    color: "#a8b0c0"
