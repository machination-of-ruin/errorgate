# Every slot is written out in full: a slots entry in a child prototype replaces all the slots of the parent (a missing whitelist takes anything, a missing chamber slot leaves the gun unable to chamber).
# Guns that start with a randomly loaded magazine. The normal guns always spawn with a full one.

- type: entity
  id: WeaponPistolMakarovRandomMag
  parent: WeaponPistolMakarov
  suffix: Random magazine
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine9x19
        startingItem: Magazine9x19Random
      gun_chamber:
        name: Chamber
        priority: 1
        locked: true
        whitelist:
          tags:
          - Cartridge9x19

