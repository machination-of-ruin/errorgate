# Random-load ammo boxes (bias 1, like the old fork) for the loot tables. Separate prototypes on purpose: the normal boxes always spawn full.

- type: entity
  id: AmmoBox9x19Random
  suffix: Random
  parent: AmmoBox9x19
  components:
  - type: BallisticAmmoProvider
    randomizeAmmo: true
    randomizeAmmoBias: 1 # old fork: even spread from empty to full (the default 5 gives mostly a few rounds)

