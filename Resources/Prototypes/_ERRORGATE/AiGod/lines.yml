# ERRORGATE: what MACHINATION OF RUIN says when no model is asked. Cold, short, one sentence each, a machine logging.
# She never guides: no orders, no hints, no goals. Prayer answers state no result, the answer is for the model to give.
# Slots: {name}, {number}, {sector}.
# Every line has to pass the rules in voice.yml, the test GodScriptedTest checks it.
# Player-facing: every change to these lines needs the project owner's approval.
- type: godLines
  id: Default
  error:
  - "{name}: ERROR LOGGED."
  - "ERROR COUNTED FOR {name}."
  - "{name} IS NO LONGER TRACKED."
  - "HUMAN ERROR DETECTED."
  - "S{number} DELETED."
  - "{name}: RE-INSTANTIATION PENDING."
  - "{name} STOPPED RESPONDING."
  - "S{number}: ERROR."
  omen:
  - "SECTOR {sector}: MOVEMENT LOGGED."
  - "{name}: STILL PRESENT."
  - "NO IMPROVEMENT DETECTED."
  - "{name} IS BEING OBSERVED."
  - "ERROR RATE UNCHANGED."
  - "SIGNAL INTERRUPTED AND RESTORED."
  - "{name}: HEARTBEAT LOGGED."
  - "SECTOR {sector} DOES NOT MATCH ITS RECORD."
  - "ERROR COUNT CONTINUES."
  - "S{number}: NO ERROR RECORDED YET."
  - "A SUBJECT IN SECTOR {sector} WAS LOGGED TWICE."
  prayer:
  - "PRAYER RECEIVED FROM {name}."
  - "{name}: MESSAGE LOGGED."
  - "{name}: INPUT RECEIVED."
  - "S{number}: PRAYER LOGGED."
