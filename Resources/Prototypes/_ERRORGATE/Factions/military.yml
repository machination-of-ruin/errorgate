# Military soldiers (docs/design/factions.md). The kits follow the Solar Alliance kits of the PvP prototypes (green BDUs, helmet, flak
# vest, webbing), with what this repo has in place of the PvP-only items. Everything they wear and carry is real: it drops when they die.

- type: startingGear
  id: MilitaryRiflemanGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitSolFatigueGreen
    head: ClothingHeadHelmetBasic
    outerClothing: ClothingOuterVestFlak
    shoes: ClothingShoesBootsCombat
    gloves: ClothingHandsGlovesCombat
    belt: ClothingBeltMilitaryWebbing
    back: ClothingBackpackSatchelLeather
    suitstorage: WeaponRifleSVT
    neck: ClothingNeckDogtags
  storage:
    belt:
    - Magazine762x39LowCapacity
    - Magazine762x39LowCapacity
    - Magazine762x39LowCapacity
    back:
    - Tourniquet
    - SmokeGrenade
    - BoxMRE

- type: startingGear
  id: MilitaryMedicGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitSolFatigueGreen
    head: ClothingHeadHatBeretMedic
    outerClothing: ClothingOuterCoatGreatcoat
    shoes: ClothingShoesBootsCombat
    gloves: ClothingHandsGlovesCombat
    belt: ClothingBeltMilitaryWebbing
    back: ClothingBackpackSatchelMedical
    suitstorage: WeaponRifleSVT
    neck: ClothingNeckDogtags
  storage:
    belt:
    - Magazine762x39LowCapacity
    - Magazine762x39LowCapacity
    back:
    - MedkitCombatFilled
    - Tourniquet
    - Tourniquet
    - Tourniquet
    - SmokeGrenade
    - SmokeGrenade

- type: startingGear
  id: MilitaryOfficerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitSolFatigueGreen
    head: ClothingHeadHatSANArmyCapOfficer
    outerClothing: ClothingOuterCoatGreatcoat
    shoes: ClothingShoesBootsCombat
    gloves: ClothingHandsGlovesCombat
    belt: ClothingBeltMilitaryWebbing
    back: ClothingBackpackSatchelLeather
    suitstorage: WeaponRifleSVT
    neck: ClothingNeckDogtags
  storage:
    belt:
    - Magazine762x39LowCapacity
    - Magazine762x39LowCapacity
    - Magazine762x39LowCapacity
    - WeaponRevolverInspector
    back:
    - Tourniquet
    - Handcuffs
    - Handcuffs
    - SmokeGrenade
    - BoxMRE

- type: entity
  abstract: true
  parent: BaseMobHuman
  id: MobMilitaryBase
  components:
  - type: NpcFactionMember
    factions:
    - Military
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: SimpleHumanoidHostileCompound

- type: entity
  parent: MobMilitaryBase
  id: MobMilitaryRifleman
  name: soldier
  suffix: Military, rifleman
  components:
  - type: Loadout
    prototypes: [ MilitaryRiflemanGear ]

- type: entity
  parent: MobMilitaryBase
  id: MobMilitaryMedic
  name: medic
  suffix: Military
  components:
  - type: Loadout
    prototypes: [ MilitaryMedicGear ]

- type: entity
  parent: MobMilitaryBase
  id: MobMilitaryOfficer
  name: officer
  suffix: Military
  components:
  - type: Loadout
    prototypes: [ MilitaryOfficerGear ]

# One soldier comes back every two hours, and only while the one before is gone.
- type: entity
  abstract: true
  parent: MobSpawnerBase
  id: MobSpawnerMilitaryBase
  components:
  - type: SmartMobSpawner
    spawnRate: 0.5
  - type: Sprite
    layers:
    - state: red
    - sprite: Mobs/Species/Human/parts.rsi
      state: full

- type: entity
  parent: MobSpawnerMilitaryBase
  id: MobSpawnerMilitaryRifleman
  name: mob spawner
  suffix: soldier, Military
  components:
  - type: SmartMobSpawner
    mobPrototype: MobMilitaryRifleman

- type: entity
  parent: MobSpawnerMilitaryBase
  id: MobSpawnerMilitaryMedic
  name: mob spawner
  suffix: medic, Military
  components:
  - type: SmartMobSpawner
    mobPrototype: MobMilitaryMedic

- type: entity
  parent: MobSpawnerMilitaryBase
  id: MobSpawnerMilitaryOfficer
  name: mob spawner
  suffix: officer, Military
  components:
  - type: SmartMobSpawner
    mobPrototype: MobMilitaryOfficer
