# Bandits (docs/design/factions.md): no faction but their own, hostile to everyone else. The kits follow the fugitive bandits of the
# PvP prototypes, with what this repo has in place of the PvP-only items.

# A striped shirt (the fugitive bandits' vest)
- type: entity
  parent: ClothingUniformJumpsuitMime
  id: ClothingUniformJumpsuitStripedShirt
  name: striped shirt
  description: A striped shirt.

# The clothes of every bandit; the gun comes with the variants below (one picked at random per bandit by the Loadout of MobBandit)
- type: startingGear
  id: BanditGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitStripedShirt
    outerClothing: ClothingOuterCoatBomber
    head: ClothingHeadHatUshanka
    mask: ClothingMaskNeckGaiter
    shoes: ClothingShoesBootsWork
    gloves: ClothingHandsGlovesFingerless
    belt: ClothingBeltHolster
    pocket1: Handcuffs
    pocket2: FlashlightLantern

- type: startingGear
  id: BanditMakarovGear
  subGear:
  - BanditGear
  storage:
    belt:
    - WeaponPistolMakarov
    - Magazine9x19
    - Magazine9x19

- type: startingGear
  id: BanditIzhGear
  subGear:
  - BanditGear
  equipment:
    suitstorage: WeaponShotgunDoubleBarreled
  storage:
    belt:
    - ShellShotgun
    - ShellShotgun
    - ShellShotgun
    - ShellShotgun

- type: startingGear
  id: BanditObrezGear
  subGear:
  - BanditGear
  equipment:
    suitstorage: WeaponShotgunSawn
  storage:
    belt:
    - ShellShotgun
    - ShellShotgun

- type: startingGear
  id: BanditSimonovGear
  subGear:
  - BanditGear
  equipment:
    suitstorage: WeaponSniperSKS

- type: startingGear
  id: BanditBossGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitStripedShirt
    outerClothing: ClothingOuterCoatGentle
    head: ClothingHeadHatTCFLBeretDress
    eyes: ClothingEyesGlassesSunglasses
    mask: ClothingMaskNeckGaiter
    shoes: ClothingShoesBootsWork
    gloves: ClothingHandsGlovesFingerless
    belt: ClothingBeltHolster
    suitstorage: WeaponRifleAk
    pocket1: Handcuffs
    pocket2: FlashlightLantern
  storage:
    belt:
    - WeaponPistolStechkin
    - Magazine9x19HighCapacity
    - Magazine9x19HighCapacity

- type: entity
  abstract: true
  parent: BaseMobHuman
  id: MobBanditBase
  components:
  - type: NpcFactionMember
    factions:
    - Bandit
  - type: InputMover
  - type: MobMover
  - type: NpcFlashlight
  - type: HTN
    rootTask:
      task: ErrorgateHumanoidHostileCompound

- type: entity
  parent: MobBanditBase
  id: MobBandit
  name: bandit
  suffix: Bandit
  components:
  - type: Loadout
    prototypes: [ BanditMakarovGear, BanditIzhGear, BanditObrezGear, BanditSimonovGear ] # one at random

- type: entity
  parent: MobBanditBase
  id: MobBanditBoss
  name: bandit boss
  suffix: Bandit
  components:
  - type: Loadout
    prototypes: [ BanditBossGear ]

- type: entity
  abstract: true
  parent: MobSpawnerBase
  id: MobSpawnerBanditBase
  components:
  - type: SmartMobSpawner
    spawnRate: 0.5
  - type: Sprite
    layers:
    - state: red
    - sprite: Mobs/Species/Human/parts.rsi
      state: full

- type: entity
  parent: MobSpawnerBanditBase
  id: MobSpawnerBandit
  name: mob spawner
  suffix: bandit, Bandit
  components:
  - type: SmartMobSpawner
    mobPrototype: MobBandit

- type: entity
  parent: MobSpawnerBanditBase
  id: MobSpawnerBanditBoss
  name: mob spawner
  suffix: bandit boss, Bandit
  components:
  - type: SmartMobSpawner
    mobPrototype: MobBanditBoss
