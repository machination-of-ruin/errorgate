# Reverb the distant gunshots are played through: a dark, long, echoing tail (like the Mountains preset, with more of it
# and almost no highs), so far shots read as a muffled boom rolling over the wasteland.
- type: audioPreset
  id: DistantGunfire
  createAuxiliary: true
  density: 1.0000
  diffusion: 0.2700
  gain: 0.5000
  gainHf: 0.0200
  gainLf: 1.0000
  decayTime: 3.5000
  decayHfRatio: 0.1500
  decayLfRatio: 1.0000
  reflectionsGain: 0.1000
  reflectionsDelay: 0.3000
  reflectionsPan: 0,0,0
  lateReverbGain: 0.4000
  lateReverbDelay: 0.1000
  lateReverbPan: 0,0,0
  echoTime: 0.2500
  echoDepth: 1.0000
  modulationTime: 0.2500
  modulationDepth: 0.0000
  airAbsorptionGainHf: 0.9943
