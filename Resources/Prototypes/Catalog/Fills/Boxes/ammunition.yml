# As opposed to MagazineBox these are boxes of magazines so BoxMagazine
# CaselessRifle
- type: entity
  name: box of magazines
  parent: BoxSteel # WWDP edit
  id: BoxMagazine
  description: A box full of magazines.
  components:
  - type: Sprite
    layers:
    - state: box_steel_rib_base # WWDP edit start
    - state: bg
      map: [ paper ]
      sprite: _White/Objects/Storage/boxes_icon.rsi
    - state: magazine
      map: [ label ]
      sprite: _White/Objects/Storage/boxes_icon.rsi
    - state: box_steel_sec
      map: [ top ]
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        top:
          True: { state: box_steel_sec_open }
          False: { state: box_steel_sec } # WWDP end

- type: entity
  name: box of 6mm caseless magazines
  parent: BoxMagazine
  id: BoxMagazinePistolCaselessRifle
  description: A box full of 6mm caseless magazines.
  components:
  - type: StorageFill
    contents:
      - id: MagazinePistol6mmCaseless
        amount: 4

- type: entity
  name: box of 6mm caseless (practice) magazines
  parent: BoxMagazine
  id: BoxMagazinePistolCaselessRiflePractice
  description: A box full of 6mm caseless practice magazines.
