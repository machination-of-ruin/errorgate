            sprite: _White/Mobs/Species/Human/displacement.rsi
            state: gloves
      outerClothing-body-slim:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/Human/displacement.rsi
            state: outer
      hardsuit-body-slim:
