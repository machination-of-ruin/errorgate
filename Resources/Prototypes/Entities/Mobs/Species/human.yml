# Anything human specific (e.g. UI, input) goes under MobHuman
- type: entity
  parent: BaseMobSpeciesOrganic
  id: BaseMobHuman
  name: Urist McHands
  abstract: true
  components:
  - type: Hunger
    baseDecayRate: 0.1 # ERRORGATE: you will die of hunger, default is 0.0167
    starvationDamage:
      types:
        Bloodloss: 1
  - type: EyeCursorOffset # ERRORGATE: look into the distance with Space (old fork "look far")
    maxOffset: 12 # almost a full screen ahead, as in the old build
    pvsIncrease: 1.2
  - type: Icon # It will not have an icon in the adminspawn menu without this. Body parts seem fine for whatever reason.
    sprite: Mobs/Species/Human/parts.rsi
    state: full
  - type: Thirst
  - type: Carriable # Carrying system from nyanotrasen.
  - type: Butcherable # ERRORGATE: cannibalism, butcher with a knife
    butcheringType: Knife
    spawned:
    - id: FoodMeatHuman
      amount: 3
    - id: HeadSkeleton
    - id: MaterialBones1
      amount: 4
  - type: HumanoidAppearance
    species: Human
    hideLayersOnEquip:
    - Hair
    - Snout
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    understands:
    - TauCetiBasic
  - type: FootPrints
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
      # WD EDIT START
      jumpsuit-body-slim:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/Human/displacement.rsi
            state: jumpsuit
      shoes-body-slim:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/Human/displacement.rsi
            state: shoes
      gloves-body-slim:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/Human/displacement.rsi
            state: gloves
      outerClothing-body-slim:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/Human/displacement.rsi
            state: outer
      hardsuit-body-slim:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/Human/displacement.rsi
            state: hardsuit
      suit-body-slim:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/Human/displacement.rsi
            state: suit
      # WD EDIT END

