- type: entity
  abstract: true
  parent: BaseAmmoBox
  id: BaseAmmoBox762x39
  name: ammunition box (7.62x39mm)
  suffix: 20 # ERRORGATE
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - Cartridge762x39
    proto: Cartridge762x39
    capacity: 20 # ERRORGATE: old fork count
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/light_rifle.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 2 # ERRORGATE: old box art has one fill state
    zeroVisible: false
  - type: Appearance

