- type: entity
  abstract: true
  parent: BaseAmmoBox
  id: BaseAmmoBoxCaselessRifle
  name: ammunition box (6mm caseless)
  suffix: 20 # ERRORGATE
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - Cartridge6mmCaseless
    proto: Cartridge6mmCaseless
    capacity: 20 # ERRORGATE: old fork count
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/caseless_rifle.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 2 # ERRORGATE: old box art has one fill state
    zeroVisible: false
  - type: Appearance

# Boxes
- type: entity
  parent: BaseAmmoBoxCaselessRifle
  id: AmmoBoxCaselessRifle
  name: ammunition box (6mm caseless)
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge6mmCaseless
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

