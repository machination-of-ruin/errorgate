- type: entity
  id: BaseCartridge6mmCaseless
  name: cartridge (.25 rifle)
  parent: [ BaseCartridge, BaseSecurityContraband ]
  abstract: true
  components:
  - type: DistantGunfireAudible # ERRORGATE
    range: 55
  - type: Tag
    tags:
      - Cartridge
      - Cartridge6mmCaseless
  - type: CartridgeAmmo
    deleteOnSpawn: true
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 10

- type: entity
  id: Cartridge6mmCaseless
  name: cartridge (6mm caseless)
  parent: BaseCartridge6mmCaseless
  components:
  - type: CartridgeAmmo
    proto: Bullet6mmCaseless

- type: entity
  id: Cartridge6mmCaselessPractice
  name: cartridge (6mm caseless practice)
  parent: BaseCartridge6mmCaseless
  components:
