- type: entity
  id: BaseMagazine45ACP
  name: pistol magazine (.45 ACP)
  parent: [ BaseMagazine9x19, BaseSecurityContraband ]
  abstract: true
  components:
  - type: Tag
    tags:
      - Magazine45ACP
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge45ACP
    capacity: 7

- type: entity
  id: BaseMagazine45ACPSubMachineGun
  name: SMG magazine (.45 ACP)
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - Magazine45ACPSubMachineGun
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge45ACP
    capacity: 25
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Magnum/magnum_smg_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

