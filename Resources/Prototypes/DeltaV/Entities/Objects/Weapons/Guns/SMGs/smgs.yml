- type: entity
  name: Typewriter
  parent: [BaseWeaponSubMachineGun, BaseGunWieldable] # WWDP
  id: WeaponSubMachineGunTypewriter
  description: A modern take on the classic design used by mobsters throughout space and time. Types 9x19mm ammo.
  components:
  - type: Sprite
    sprite: DeltaV/Objects/Weapons/Guns/SMGs/typewriter.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: DeltaV/Objects/Weapons/Guns/SMGs/typewriter.rsi
  - type: Gun
    # minAngle: 1 # WWDP
    # maxAngle: 15 # WWDP
    # angleIncrease: 5
    # angleDecay: 20 # WWDP
    fireRate: 8
    soundGunshot:
      path: /Audio/DeltaV/Weapons/Guns/Gunshots/typewriter.ogg
  - type: ChamberMagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine9x19SubMachineGun
        insertSound: /Audio/Weapons/Guns/MagIn/hpistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine9x19SubMachineGun
      gun_chamber:
        name: Chamber
        startingItem: Cartridge9x19
        priority: 1
        whitelist:
          tags:
            - Cartridge9x19
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
