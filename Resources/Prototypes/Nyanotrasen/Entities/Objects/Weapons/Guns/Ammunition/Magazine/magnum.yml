- type: entity
  id: BaseMagazineUniversalMagnum
  name: "mk 32 'Universal' magazine (.45 ACP)"
  parent: BaseMagazine9x19
  abstract: true
  components:
  - type: Tag
    tags:
    - MagazineUSP45ACP
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - Cartridge45ACP
    proto: Cartridge45ACP
    capacity: 12
  - type: Item
    size: Small
  - type: Sprite
    sprite: Nyanotrasen/Objects/Weapons/Guns/Ammunition/Magazine/Magnum/universal_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 12
    zeroVisible: false
  - type: Appearance

