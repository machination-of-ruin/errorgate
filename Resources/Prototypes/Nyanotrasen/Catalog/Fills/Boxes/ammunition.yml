- type: entity
  name: box of soulbreaker cartridges
  parent: AmmoProviderShotgunShell
  id: BoxShellSoulbreaker
  description: A box full of anti-psionic soulbreaker cartridges, designed for riot shotguns.
  components:
    - type: BallisticAmmoProvider
      proto: ShellSoulbreaker
      capacity: 12
    - type: Sprite
      layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-slug-1
        map: ["enum.GunVisualLayers.Mag"]
      - state: slug
    - type: GuideHelp
      guides: [ Mindbreaking ]


- type: entity
  name: box of .357 Magnum Universal magazines
  parent: BoxMagazine
  id: BoxMagazineUniversalMagnum
  description: A box full of .357 Magnum magazines.
  components:
  - type: StorageFill
    contents:
      - id: MagazineUSP45ACP
        amount: 6

- type: entity
  name: box of .357 Magnum Universal (practice) magazines
  parent: BoxMagazine
  id: BoxMagazineUniversalMagnumPractice
  description: A box full of .357 Magnum practice magazines.
  components:
  - type: StorageFill
    contents:
      - id: MagazineUSP45ACPPractice
        amount: 6

- type: entity
  name: box of 7.62x39mm speed loaders
  parent: BoxMagazine
  id: BoxSpeedLoaderLightRifle
  description: A box full of 7.62x39mm speed loaders.
  components:
  - type: StorageFill
    contents:
    - id: SpeedLoader762x39
      amount: 6
